name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx biome check --diagnostic-level=error .
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
