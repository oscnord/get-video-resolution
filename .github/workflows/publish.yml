name: Publish Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Refuse to publish a broken build. Mirrors the CI test+build job.
      - run: bunx biome check --diagnostic-level=error .
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
      # Smoke-import the built artefact before publishing.
      - run: node -e "const m = require('./dist/index.cjs'); if (typeof m.getVideoResolution !== 'function') process.exit(1);"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }}
      - run: bun run build
      - run: npm publish --provenance --access public
      - run: git push --follow-tags
      # After the tag is on the remote, so the release has something to point at.
      - run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release create "$TAG" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
